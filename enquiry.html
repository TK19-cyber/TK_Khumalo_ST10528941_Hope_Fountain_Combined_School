<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>School Enquiries and Admissions | Hope Fountain Combined School</title>

    <meta name="description"
        content="Contact Hope Fountain Combined School in Hillbrow, Johannesburg, for enquiries about admissions, academics, sports and school information.">

    <meta name="keywords"
        content="Hope Fountain Combined School, school admissions, school enquiries, Hillbrow Johannesburg, school academics, school sports">

    <meta name="author" content="Hope Fountain Combined School">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Hope Fountain Combined School</h1>
        <p>Hillbrow, Johannesburg</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="academics.html">Academics</a>
        <a href="sports.html">Sports</a>
        <a href="enquiry.html" aria-current="page">Enquiry</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>

        <section>
            <h2>Make an Enquiry</h2>

            <p>
                Complete the form below if you have any questions
                about admissions, academics, sports or the school
                in general.
            </p>

            <form id="enquiryForm">

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" minlength="2" maxlength="80" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <label for="type">Enquiry Type:</label>

                <select id="type" name="type" required>
                    <option value="">Select an option</option>
                    <option value="Admissions">Admissions</option>
                    <option value="Academics">Academics</option>
                    <option value="Sports">Sports</option>
                    <option value="General Question">General Question</option>
                </select>

                <label for="message">Message:</label>

                <textarea id="message" name="message" rows="5" minlength="10" maxlength="1000"
                    placeholder="Write your enquiry here..." required></textarea>

                <button type="submit" class="button">
                    Submit Enquiry
                </button>

            </form>

            <p id="result" aria-live="polite"></p>

        </section>

    </main>

    <footer>
        <p>© 2026 Hope Fountain Combined School</p>
    </footer>

    <script src="js/script.js"></script>

</body>

</html>
