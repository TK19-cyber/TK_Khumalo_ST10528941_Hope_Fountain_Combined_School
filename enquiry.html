<!DOCTYPE html>
<html>

<head>
    <title>Enquiry - Hope Fountain Combined School</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Hope Fountain Combined School</h1>
        <p>Hillbrow, Johannesburg</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="academics.html">Academics</a>
        <a href="sports.html">Sports</a>
        <a href="enquiry.html">Enquiry</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>

        <section>

            <h2>Make an Enquiry</h2>

            <p>
                Complete the form below if you have any questions
                about admissions, academics, sports or the school
                in general.
            </p>

            <form id="enquiryForm">

                <label for="name">Full Name:</label>
                <input type="text" id="name" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" required>

                <label for="type">Enquiry Type:</label>

                <select id="type" required>
                    <option value="">Select an option</option>
                    <option value="Admissions">Admissions</option>
                    <option value="Academics">Academics</option>
                    <option value="Sports">Sports</option>
                    <option value="General Question">General Question</option>
                </select>

                <label for="message">Message:</label>

                <textarea id="message"
                    rows="5"
                    placeholder="Write your enquiry here..."
                    required></textarea>

                <button type="submit" class="button">
                    Submit Enquiry
                </button>

            </form>

            <p id="result"></p>

        </section>

    </main>

    <footer>
        <p>© 2026 Hope Fountain Combined School</p>
    </footer>

    <script src="js/script.js"></script>

</body>

</html>
